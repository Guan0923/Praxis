name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  tests:
    name: Backend tests / Python ${{ matrix.python-version }} / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRAXIS_MCP_V1_PYTHON: ${{ github.workspace }}/.tmp-mcp-v1/bin/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Prepare MCP v1 integration peer
        run: |
          uv venv .tmp-mcp-v1 --python ${{ matrix.python-version }}
          uv pip install --python "$PRAXIS_MCP_V1_PYTHON" "mcp==1.29.1"
      - name: Run tests from tests/
        run: uv run python -m pytest tests --cov=backend --cov-report=term-missing --durations=20

  tests-windows:
    name: Backend tests / Python 3.11 / windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PRAXIS_MCP_V1_PYTHON: ${{ github.workspace }}/.tmp-mcp-v1/Scripts/python.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Prepare MCP v1 integration peer
        run: |
          uv venv .tmp-mcp-v1 --python 3.11
          uv pip install --python "$env:PRAXIS_MCP_V1_PYTHON" "mcp==1.29.1"
      - name: Run tests from tests/
        run: uv run python -m pytest tests --cov=backend --cov-report=term-missing --durations=20
